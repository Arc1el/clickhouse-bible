<svg viewBox="0 0 680 260" role="img" aria-label="clickhouse 단일 바이너리 하나가 local 모드, server 모드, client 모드로 실행된다. 서버에는 클라이언트가 9000 포트로, HTTP가 8123 포트로 접속한다" font-family="'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', sans-serif" font-size="12">
  <defs>
    <marker id="arr-bin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B8878"/>
    </marker>
    <marker id="arr-bin-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D99E00"/>
    </marker>
  </defs>

  <!-- 단일 바이너리 -->
  <rect x="30" y="96" width="150" height="60" rx="10" fill="#F2C230" stroke="#D99E00" stroke-width="1.5"/>
  <text x="105" y="121" text-anchor="middle" fill="#201F18" font-weight="700" font-family="Menlo, monospace">./clickhouse</text>
  <text x="105" y="140" text-anchor="middle" fill="#201F18" font-size="10.5">파일 하나에 전부 내장</text>

  <!-- 세 모드 분기 -->
  <g stroke="#D99E00" stroke-width="1.6" marker-end="url(#arr-bin-acc)">
    <line x1="180" y1="110" x2="248" y2="52"/>
    <line x1="180" y1="126" x2="248" y2="126"/>
  </g>

  <!-- local 모드 -->
  <rect x="254" y="24" width="200" height="56" rx="8" fill="#8B8878" fill-opacity="0.05" stroke="#8B8878" stroke-width="1.2"/>
  <text x="354" y="46" text-anchor="middle" fill="#8B8878" font-weight="700" font-family="Menlo, monospace" font-size="11.5">clickhouse local</text>
  <text x="354" y="64" text-anchor="middle" fill="#8B8878" font-size="10.5" opacity="0.75">서버 없이 즉석 SQL — 학습·파일 분석 최적</text>
  <text x="470" y="46" font-size="10" fill="#8B8878" opacity="0.6">--path로 상태 유지</text>

  <!-- server 모드 -->
  <rect x="254" y="100" width="200" height="56" rx="8" fill="#8B8878" fill-opacity="0.05" stroke="#8B8878" stroke-width="1.2"/>
  <text x="354" y="122" text-anchor="middle" fill="#8B8878" font-weight="700" font-family="Menlo, monospace" font-size="11.5">clickhouse server</text>
  <text x="354" y="140" text-anchor="middle" fill="#8B8878" font-size="10.5" opacity="0.75">상시 대기하는 데이터베이스 서버</text>

  <!-- 접속자들 -->
  <rect x="254" y="196" width="140" height="44" rx="8" fill="#8B8878" fill-opacity="0.05" stroke="#8B8878" stroke-width="1.2"/>
  <text x="324" y="214" text-anchor="middle" fill="#8B8878" font-weight="700" font-family="Menlo, monospace" font-size="11">clickhouse client</text>
  <text x="324" y="230" text-anchor="middle" fill="#8B8878" font-size="10" opacity="0.7">대화형 셸 (시험 환경)</text>

  <rect x="470" y="196" width="180" height="44" rx="8" fill="#8B8878" fill-opacity="0.05" stroke="#8B8878" stroke-width="1.2"/>
  <text x="560" y="214" text-anchor="middle" fill="#8B8878" font-weight="700" font-size="11">브라우저 · curl · BI 도구</text>
  <text x="560" y="230" text-anchor="middle" fill="#8B8878" font-size="10" opacity="0.7">HTTP API + 내장 /play UI</text>

  <!-- 포트 화살표 -->
  <line x1="324" y1="196" x2="336" y2="160" stroke="#8B8878" stroke-width="1.4" marker-end="url(#arr-bin)"/>
  <text x="300" y="180" text-anchor="end" font-size="10.5" fill="#8B8878" opacity="0.8">Native TCP <tspan font-weight="700">:9000</tspan></text>
  <line x1="540" y1="196" x2="420" y2="150" stroke="#8B8878" stroke-width="1.4" marker-end="url(#arr-bin)"/>
  <text x="502" y="180" font-size="10.5" fill="#8B8878" opacity="0.8">HTTP <tspan font-weight="700">:8123</tspan></text>

  <text x="105" y="186" text-anchor="middle" font-size="10.5" fill="#8B8878" opacity="0.7">MySQL(:9004)·PostgreSQL(:9005)</text>
  <text x="105" y="202" text-anchor="middle" font-size="10.5" fill="#8B8878" opacity="0.7">호환 포트도 서버가 함께 연다</text>
</svg>
