<svg viewBox="0 0 680 268" role="img" aria-label="쓰기 경로에서는 uniqState가 집계의 중간 상태를 만들어 저장하고, 읽기 경로에서는 uniqMerge가 상태들을 합쳐 최종값을 만든다" font-family="'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', sans-serif" font-size="12">
  <defs>
    <marker id="arr-sm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D99E00"/>
    </marker>
  </defs>

  <text x="150" y="26" text-anchor="middle" font-weight="700" font-size="13" fill="#8B8878">쓰기 (MV 안)</text>
  <text x="540" y="26" text-anchor="middle" font-weight="700" font-size="13" fill="#8B8878">읽기 (조회 쿼리)</text>

  <!-- 원본 이벤트 -->
  <g stroke="#8B8878" stroke-width="1.1" font-family="Menlo, monospace">
    <rect x="24" y="44" width="150" height="24" fill="#8B8878" fill-opacity="0.05"/>
    <rect x="24" y="68" width="150" height="24" fill="#8B8878" fill-opacity="0.05"/>
    <rect x="24" y="92" width="150" height="24" fill="#8B8878" fill-opacity="0.05"/>
  </g>
  <g font-family="Menlo, monospace" font-size="10.5" fill="#8B8878">
    <text x="32" y="60">8/1 user 1  10.50</text>
    <text x="32" y="84">8/1 user 2   5.00</text>
    <text x="32" y="108">8/2 user 1   7.25</text>
  </g>
  <text x="99" y="132" text-anchor="middle" font-size="10.5" fill="#8B8878" opacity="0.65">원본 events</text>

  <!-- uniqState 박스 -->
  <rect x="216" y="56" width="130" height="48" rx="8" fill="#F2C230" stroke="#D99E00" stroke-width="1.3"/>
  <text x="281" y="76" text-anchor="middle" font-family="Menlo, monospace" font-size="11.5" fill="#201F18" font-weight="700">uniqState(…)</text>
  <text x="281" y="92" text-anchor="middle" font-size="10" fill="#201F18">"결과" 대신 "중간 상태"를 반환</text>
  <line x1="174" y1="80" x2="210" y2="80" stroke="#D99E00" stroke-width="1.6" marker-end="url(#arr-sm)"/>

  <!-- 저장된 상태 -->
  <text x="252" y="140" font-size="10.5" fill="#8B8878" opacity="0.65">AggregatingMergeTree에 저장</text>
  <g stroke="#8B8878" stroke-width="1.1">
    <rect x="216" y="150" width="130" height="26" fill="#8B8878" fill-opacity="0.05"/>
    <rect x="216" y="176" width="130" height="26" fill="#8B8878" fill-opacity="0.05"/>
  </g>
  <g font-family="Menlo, monospace" font-size="10.5" fill="#8B8878">
    <text x="224" y="167">8/1 → 상태▓{1,2}</text>
    <text x="224" y="193">8/2 → 상태▓{1}</text>
  </g>
  <line x1="238" y1="104" x2="238" y2="146" stroke="#D99E00" stroke-width="1.6" marker-end="url(#arr-sm)"/>

  <!-- uniqMerge -->
  <rect x="416" y="140" width="130" height="48" rx="8" fill="#F2C230" stroke="#D99E00" stroke-width="1.3"/>
  <text x="481" y="160" text-anchor="middle" font-family="Menlo, monospace" font-size="11.5" fill="#201F18" font-weight="700">uniqMerge(…)</text>
  <text x="481" y="176" text-anchor="middle" font-size="10" fill="#201F18">상태들을 합쳐 최종값으로</text>
  <line x1="346" y1="164" x2="410" y2="164" stroke="#D99E00" stroke-width="1.6" marker-end="url(#arr-sm)"/>
  <text x="378" y="156" text-anchor="middle" font-size="10" fill="#D99E00" font-weight="700">GROUP BY</text>

  <!-- 최종 결과 -->
  <rect x="580" y="140" width="76" height="48" rx="8" fill="#8B8878" fill-opacity="0.05" stroke="#8B8878" stroke-width="1.2"/>
  <text x="618" y="160" text-anchor="middle" fill="#8B8878" font-weight="700" font-size="12">8/1 → 2명</text>
  <text x="618" y="177" text-anchor="middle" fill="#8B8878" font-weight="700" font-size="12">8/2 → 1명</text>
  <line x1="546" y1="164" x2="574" y2="164" stroke="#D99E00" stroke-width="1.6" marker-end="url(#arr-sm)"/>

  <text x="340" y="232" text-anchor="middle" fill="#8B8878" opacity="0.8" font-size="11.5">왜 상태인가? "2명"과 "1명"을 더하면 3명 — 두 날에 겹치는 user 1이 중복된다.</text>
  <text x="340" y="250" text-anchor="middle" fill="#8B8878" opacity="0.8" font-size="11.5">상태▓{1,2} + 상태▓{1} = {1,2} → 2명. 상태끼리는 정확하게 합칠 수 있다 — 이것이 State/Merge 쌍의 존재 이유.</text>
</svg>
