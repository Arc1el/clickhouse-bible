<svg viewBox="0 0 680 250" role="img" aria-label="Materialized View는 원본 테이블에 INSERT되는 새 블록에만 트리거되어 변환 결과를 대상 테이블에 쓴다. 이미 저장된 과거 데이터는 통과하지 않으므로 백필이 필요하다" font-family="'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', sans-serif" font-size="12">
  <defs>
    <marker id="arr-mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D99E00"/>
    </marker>
    <marker id="arr-mv2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B8878"/>
    </marker>
  </defs>

  <!-- INSERT -->
  <rect x="24" y="60" width="104" height="40" rx="6" fill="#F2C230" stroke="#D99E00" stroke-width="1.3"/>
  <text x="76" y="78" text-anchor="middle" fill="#201F18" font-weight="700">INSERT</text>
  <text x="76" y="93" text-anchor="middle" fill="#201F18" font-size="10.5">(새 블록)</text>

  <!-- 원본 테이블 -->
  <rect x="176" y="46" width="140" height="68" rx="8" fill="#8B8878" fill-opacity="0.05" stroke="#8B8878" stroke-width="1.3"/>
  <text x="246" y="74" text-anchor="middle" fill="#8B8878" font-weight="700">원본 테이블</text>
  <text x="246" y="92" text-anchor="middle" fill="#8B8878" font-size="10.5" opacity="0.7">events (MergeTree)</text>

  <line x1="128" y1="80" x2="170" y2="80" stroke="#D99E00" stroke-width="1.8" marker-end="url(#arr-mv)"/>
  <text x="149" y="72" text-anchor="middle" font-size="10.5" fill="#D99E00" font-weight="700">① 저장</text>

  <!-- MV (트리거) -->
  <rect x="374" y="46" width="150" height="68" rx="8" fill="#8B8878" fill-opacity="0.05" stroke="#D99E00" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="449" y="68" text-anchor="middle" fill="#8B8878" font-weight="700">Materialized View</text>
  <text x="449" y="85" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#8B8878" opacity="0.75">SELECT … WHERE …</text>
  <text x="449" y="100" text-anchor="middle" font-size="10.5" fill="#8B8878" opacity="0.7">= INSERT 트리거 (저장소 아님)</text>

  <line x1="316" y1="80" x2="368" y2="80" stroke="#D99E00" stroke-width="1.8" marker-end="url(#arr-mv)"/>
  <text x="342" y="70" text-anchor="middle" font-size="10.5" fill="#D99E00" font-weight="700">② 방금 그</text>
  <text x="342" y="96" text-anchor="middle" font-size="10.5" fill="#D99E00" font-weight="700">블록만 통과</text>

  <!-- 대상 테이블 -->
  <rect x="374" y="160" width="150" height="60" rx="8" fill="#8B8878" fill-opacity="0.05" stroke="#8B8878" stroke-width="1.3"/>
  <text x="449" y="185" text-anchor="middle" fill="#8B8878" font-weight="700">대상 테이블 (TO)</text>
  <text x="449" y="202" text-anchor="middle" font-size="10.5" fill="#8B8878" opacity="0.7">purchases (MergeTree)</text>

  <line x1="449" y1="114" x2="449" y2="154" stroke="#D99E00" stroke-width="1.8" marker-end="url(#arr-mv)"/>
  <text x="516" y="136" text-anchor="middle" font-size="10.5" fill="#D99E00" font-weight="700">③ 변환 결과 INSERT</text>

  <!-- 과거 데이터는 통과 안 함 -->
  <rect x="176" y="160" width="140" height="60" rx="8" fill="#8B8878" fill-opacity="0.03" stroke="#8B8878" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="246" y="185" text-anchor="middle" fill="#8B8878" opacity="0.7">MV 생성 전의</text>
  <text x="246" y="201" text-anchor="middle" fill="#8B8878" opacity="0.7">과거 데이터</text>
  <line x1="316" y1="190" x2="368" y2="190" stroke="#8B8878" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-mv2)"/>
  <text x="342" y="181" text-anchor="middle" font-size="13" fill="#8B8878" font-weight="700">✗</text>
  <text x="342" y="212" text-anchor="middle" font-size="10" fill="#8B8878" opacity="0.7">통과 안 함 → 백필 필요</text>
</svg>
