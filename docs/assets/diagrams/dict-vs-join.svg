<svg viewBox="0 0 680 250" role="img" aria-label="JOIN은 쿼리마다 참조 테이블을 읽어 해시 테이블을 새로 만들지만, Dictionary는 메모리에 이미 올라가 있어 dictGet 함수 호출 한 번으로 즉시 조회한다" font-family="'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', sans-serif" font-size="12">
  <defs>
    <marker id="arr-dj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B8878"/>
    </marker>
    <marker id="arr-dj-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D99E00"/>
    </marker>
  </defs>

  <text x="170" y="26" text-anchor="middle" font-weight="700" font-size="13" fill="#8B8878">JOIN 방식 — 쿼리마다 준비 작업</text>
  <text x="510" y="26" text-anchor="middle" font-weight="700" font-size="13" fill="#8B8878">Dictionary 방식 — 미리 올려두고 조회만</text>

  <!-- JOIN 쪽 -->
  <rect x="40" y="44" width="120" height="40" rx="7" fill="#8B8878" fill-opacity="0.05" stroke="#8B8878" stroke-width="1.2"/>
  <text x="100" y="61" text-anchor="middle" fill="#8B8878" font-size="11" font-weight="700">쿼리 시작</text>
  <text x="100" y="76" text-anchor="middle" fill="#8B8878" font-size="10" opacity="0.7">SELECT … JOIN …</text>

  <rect x="40" y="108" width="120" height="46" rx="7" fill="#8B8878" fill-opacity="0.05" stroke="#8B8878" stroke-width="1.2"/>
  <text x="100" y="126" text-anchor="middle" fill="#8B8878" font-size="10.5">① 참조 테이블 읽기</text>
  <text x="100" y="142" text-anchor="middle" fill="#8B8878" font-size="10.5">② 해시 테이블 구축</text>
  <line x1="100" y1="84" x2="100" y2="102" stroke="#8B8878" stroke-width="1.3" marker-end="url(#arr-dj)"/>
  <text x="112" y="98" font-size="9.5" fill="#8B8878" opacity="0.6">매번 반복!</text>

  <rect x="40" y="176" width="120" height="40" rx="7" fill="#8B8878" fill-opacity="0.05" stroke="#8B8878" stroke-width="1.2"/>
  <text x="100" y="200" text-anchor="middle" fill="#8B8878" font-size="10.5">③ 행마다 대조·결합</text>
  <line x1="100" y1="154" x2="100" y2="170" stroke="#8B8878" stroke-width="1.3" marker-end="url(#arr-dj)"/>

  <text x="240" y="130" text-anchor="middle" font-size="10.5" fill="#8B8878" opacity="0.75">공식 실측</text>
  <text x="240" y="146" text-anchor="middle" font-size="11" fill="#8B8878" font-weight="700">1.28초</text>

  <!-- Dictionary 쪽 -->
  <rect x="390" y="44" width="240" height="52" rx="8" fill="#F2C230" stroke="#D99E00" stroke-width="1.3"/>
  <text x="510" y="64" text-anchor="middle" fill="#201F18" font-weight="700">Dictionary (메모리 상주)</text>
  <text x="510" y="82" text-anchor="middle" fill="#201F18" font-size="10">서버가 미리 로드 + LIFETIME 주기로 자동 갱신</text>

  <rect x="390" y="140" width="240" height="44" rx="8" fill="#8B8878" fill-opacity="0.05" stroke="#8B8878" stroke-width="1.2"/>
  <text x="510" y="158" text-anchor="middle" fill="#8B8878" font-family="Menlo, monospace" font-size="11" font-weight="700">dictGet('d', 'name', key)</text>
  <text x="510" y="175" text-anchor="middle" fill="#8B8878" font-size="10" opacity="0.7">행마다 메모리 룩업 한 번 — 준비 작업 없음</text>
  <line x1="510" y1="140" x2="510" y2="100" stroke="#D99E00" stroke-width="1.6" marker-end="url(#arr-dj-acc)"/>

  <text x="510" y="212" text-anchor="middle" font-size="11" fill="#D99E00" font-weight="700">같은 작업 0.55초 — 2.3배</text>

  <text x="340" y="240" text-anchor="middle" fill="#8B8878" opacity="0.75" font-size="11">반복되는 "코드 → 이름" 보강은 Dictionary가 정답. 단, 부등호 매칭·대형×대형 결합은 여전히 JOIN의 영역이다.</text>
</svg>
