<svg viewBox="0 0 680 300" role="img" aria-label="모의고사 12과제를 마치면 완성되는 시스템 구조. CSV가 events 테이블로 들어가고, 두 개의 MV가 purchases와 daily_users로 퍼 나르며, events에는 projection과 skip index가 붙는다. 별도로 ReplacingMergeTree 프로필과 CollapsingMergeTree 장바구니가 있다" font-family="'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', sans-serif" font-size="12">
  <defs>
    <marker id="arr-mock" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D99E00"/>
    </marker>
  </defs>

  <text x="340" y="22" text-anchor="middle" font-weight="700" font-size="13" fill="currentColor">12과제를 다 풀면 이 시스템이 완성된다 (번호 = 과제 번호)</text>

  <!-- CSV -->
  <rect x="24" y="60" width="110" height="44" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="79" y="79" text-anchor="middle" fill="currentColor" font-weight="700" font-size="11">events.csv</text>
  <text x="79" y="95" text-anchor="middle" fill="currentColor" font-size="9.5" opacity="0.7">②삽입 ③변환삽입</text>

  <!-- events -->
  <rect x="190" y="46" width="170" height="72" rx="9" fill="#F2C230" stroke="#D99E00" stroke-width="1.4"/>
  <text x="275" y="66" text-anchor="middle" fill="#201F18" font-weight="700">shop.events ①</text>
  <text x="275" y="82" text-anchor="middle" fill="#201F18" font-size="9.5">MergeTree · (event_type, time)</text>
  <text x="275" y="97" text-anchor="middle" fill="#201F18" font-size="9.5">+ ⑧projection(by_user)</text>
  <text x="275" y="110" text-anchor="middle" fill="#201F18" font-size="9.5">+ ⑨set index(country) · ⑩DELETE</text>

  <line x1="134" y1="82" x2="184" y2="82" stroke="#D99E00" stroke-width="1.6" marker-end="url(#arr-mock)"/>

  <!-- 분석 쿼리 -->
  <text x="275" y="140" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.75">④문자열·시간 분석 ⑤집계 쿼리는 여기서</text>

  <!-- MV 두 개 -->
  <g stroke="#D99E00" stroke-width="1.6" marker-end="url(#arr-mock)">
    <line x1="360" y1="66" x2="428" y2="66"/>
    <line x1="360" y1="98" x2="428" y2="98"/>
  </g>
  <text x="394" y="58" text-anchor="middle" font-size="9.5" fill="#D99E00" font-weight="700">⑥MV</text>
  <text x="394" y="116" text-anchor="middle" font-size="9.5" fill="#D99E00" font-weight="700">⑦MV+State</text>

  <rect x="434" y="46" width="220" height="36" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="544" y="62" text-anchor="middle" fill="currentColor" font-weight="700" font-size="11">shop.purchases — 구매만 실시간 복사</text>
  <text x="544" y="76" text-anchor="middle" fill="currentColor" font-size="9.5" opacity="0.7">비집계 MV (MergeTree)</text>

  <rect x="434" y="90" width="220" height="36" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="544" y="106" text-anchor="middle" fill="currentColor" font-weight="700" font-size="11">shop.daily_users — 일별 고유 사용자</text>
  <text x="544" y="120" text-anchor="middle" fill="currentColor" font-size="9.5" opacity="0.7">AggregatingMergeTree · uniqState/Merge</text>

  <!-- 독립 테이블 2개 -->
  <rect x="120" y="184" width="200" height="56" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="220" y="205" text-anchor="middle" fill="currentColor" font-weight="700" font-size="11">shop.user_profiles ⑪</text>
  <text x="220" y="221" text-anchor="middle" fill="currentColor" font-size="9.5" opacity="0.7">ReplacingMergeTree(updated_at)</text>
  <text x="220" y="234" text-anchor="middle" fill="currentColor" font-size="9.5" opacity="0.7">upsert → FINAL / argMax로 조회</text>

  <rect x="360" y="184" width="200" height="56" rx="8" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
  <text x="460" y="205" text-anchor="middle" fill="currentColor" font-weight="700" font-size="11">shop.cart_state ⑫</text>
  <text x="460" y="221" text-anchor="middle" fill="currentColor" font-size="9.5" opacity="0.7">CollapsingMergeTree(sign)</text>
  <text x="460" y="234" text-anchor="middle" fill="currentColor" font-size="9.5" opacity="0.7">+1/−1 상쇄 · sum(x×sign) 조회</text>

  <text x="340" y="272" text-anchor="middle" fill="currentColor" opacity="0.8" font-size="11.5">시험도 이렇게 앞 과제의 결과물 위에 뒤 과제가 쌓인다 — 과제마다 count()로 검증하고 넘어가는 습관이 점수를 지킨다.</text>
</svg>
