<svg viewBox="0 0 680 268" role="img" aria-label="minmax skipping index는 granule 묶음마다 최솟값과 최댓값 요약을 저장한다. WHERE price > 180 쿼리는 요약만 보고 max가 180 이하인 구간을 통째로 건너뛴다" font-family="'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', sans-serif" font-size="12">
  <text x="340" y="24" text-anchor="middle" font-weight="700" font-size="13" fill="currentColor">WHERE price > 180  —  minmax skipping index의 판단 과정</text>

  <!-- 4개 블록 -->
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="30"  y="70" width="140" height="86" rx="8" fill="currentColor" fill-opacity="0.03"/>
    <rect x="190" y="70" width="140" height="86" rx="8" fill="currentColor" fill-opacity="0.03"/>
    <rect x="350" y="70" width="140" height="86" rx="8" fill="#F2C230"/>
    <rect x="510" y="70" width="140" height="86" rx="8" fill="#F2C230"/>
  </g>

  <!-- 요약 태그 -->
  <g font-family="Menlo, monospace" font-size="11" text-anchor="middle" font-weight="700">
    <text x="100" y="60" fill="currentColor">min 10 · max 95</text>
    <text x="260" y="60" fill="currentColor">min 40 · max 170</text>
    <text x="420" y="60" fill="#D99E00">min 90 · max 260</text>
    <text x="580" y="60" fill="#D99E00">min 200 · max 480</text>
  </g>

  <!-- 블록 내용 -->
  <g text-anchor="middle" font-size="11">
    <text x="100" y="105" fill="currentColor" opacity="0.55">granule 4개 묶음</text>
    <text x="100" y="126" fill="currentColor" font-weight="700" font-size="15">✗ 건너뜀</text>
    <text x="100" y="144" fill="currentColor" opacity="0.55">max 95 &lt; 180</text>
    <text x="260" y="105" fill="currentColor" opacity="0.55">granule 4개 묶음</text>
    <text x="260" y="126" fill="currentColor" font-weight="700" font-size="15">✗ 건너뜀</text>
    <text x="260" y="144" fill="currentColor" opacity="0.55">max 170 &lt; 180</text>
    <text x="420" y="105" fill="#201F18" opacity="0.7">granule 4개 묶음</text>
    <text x="420" y="126" fill="#201F18" font-weight="700" font-size="15">읽음</text>
    <text x="420" y="144" fill="#201F18" opacity="0.7">180이 있을 수도</text>
    <text x="580" y="105" fill="#201F18" opacity="0.7">granule 4개 묶음</text>
    <text x="580" y="126" fill="#201F18" font-weight="700" font-size="15">읽음</text>
    <text x="580" y="144" fill="#201F18" opacity="0.7">전부 후보</text>
  </g>

  <text x="340" y="192" text-anchor="middle" fill="currentColor" opacity="0.8" font-size="11.5">인덱스가 "여기 답이 있다"를 찾아주는 게 아니라, <tspan font-weight="700">"여기엔 답이 없다"를 증명해 읽기를 면제</tspan>해 준다.</text>
  <text x="340" y="212" text-anchor="middle" fill="currentColor" opacity="0.8" font-size="11.5">GRANULARITY 4 = granule 4개(32,768행) 묶음마다 요약 하나. 값이 디스크 위에서 몰려 있을수록 잘 작동하고,</text>
  <text x="340" y="230" text-anchor="middle" fill="currentColor" opacity="0.8" font-size="11.5">모든 구간에 값이 골고루 흩어져 있으면 하나도 건너뛰지 못한다 (그때는 projection이나 bloom_filter를 검토).</text>
</svg>
