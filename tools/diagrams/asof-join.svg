<svg viewBox="0 0 680 226" role="img" aria-label="ASOF JOIN은 각 거래 시각에서 시간을 거슬러 올라가 가장 가까운 이전 호가를 짝지어 준다. 정확히 일치하는 시각이 없어도 매칭된다" font-family="'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', sans-serif" font-size="12">
  <defs>
    <marker id="arr-asof" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D99E00"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-weight="700" font-size="13" fill="currentColor">ASOF JOIN:  trades.t ≥ quotes.t  —  "그 시점 직전의 호가를 붙여라"</text>

  <!-- 시간축 -->
  <line x1="50" y1="120" x2="640" y2="120" stroke="currentColor" stroke-width="1.4"/>
  <text x="644" y="112" text-anchor="end" font-size="10.5" fill="currentColor" opacity="0.6">시간 →</text>

  <!-- quotes (아래) -->
  <g>
    <circle cx="120" cy="120" r="6" fill="currentColor"/>
    <circle cx="300" cy="120" r="6" fill="currentColor"/>
    <circle cx="520" cy="120" r="6" fill="currentColor"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="currentColor">
    <text x="120" y="146">호가 10:00:00</text>
    <text x="120" y="161" font-family="Menlo, monospace">bid 150.00</text>
    <text x="300" y="146">호가 10:00:04</text>
    <text x="300" y="161" font-family="Menlo, monospace">bid 150.05</text>
    <text x="520" y="146">호가 10:00:09</text>
    <text x="520" y="161" font-family="Menlo, monospace">bid 150.20</text>
  </g>

  <!-- trades (위) -->
  <g>
    <rect x="360" y="52" width="130" height="36" rx="7" fill="#F2C230" stroke="#D99E00" stroke-width="1.3"/>
    <text x="425" y="68" text-anchor="middle" fill="#201F18" font-weight="700" font-size="11">거래 10:00:05</text>
    <text x="425" y="83" text-anchor="middle" fill="#201F18" font-family="Menlo, monospace" font-size="10.5">price 150.10</text>
  </g>
  <line x1="425" y1="88" x2="425" y2="114" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- 뒤로 찾아가는 화살표 -->
  <path d="M 418 100 Q 360 96 308 112" fill="none" stroke="#D99E00" stroke-width="1.8" marker-end="url(#arr-asof)"/>
  <text x="356" y="96" text-anchor="middle" font-size="10.5" fill="#D99E00" font-weight="700">가장 가까운 "이전" 호가로</text>

  <!-- 매칭 안 되는 후보 표시 -->
  <text x="520" y="104" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">✗ 미래(10:00:09)는 후보 아님</text>

  <text x="340" y="196" text-anchor="middle" fill="currentColor" opacity="0.8" font-size="11.5">결과 행: 거래 10:00:05 | price 150.10 | <tspan font-weight="700">bid 150.05</tspan> — 등가 JOIN이면 "정확히 같은 시각"이 없어 매칭 실패했을 것.</text>
  <text x="340" y="214" text-anchor="middle" fill="currentColor" opacity="0.8" font-size="11.5">문법: 등가 조건(심볼) 1개 + 부등호 조건(시간) 1개 필수 — 시계열 결합의 표준 도구다.</text>
</svg>
