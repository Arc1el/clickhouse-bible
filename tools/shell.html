<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title><!--TITLE--></title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ClickHouse Certified Developer 자격증 합격을 위한 완전 입문 한국어 학습서. 전 예제 ClickHouse 26.8 검증, 모의고사 12과제 포함.">
<meta property="og:title" content="ClickHouse Bible">
<meta property="og:description" content="지식 0에서 ClickHouse 자격증 합격까지 — 검증된 한 권">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<style>
:root {
  --bg: #FBFAF6;
  --surface: #F3F1E7;
  --surface2: #EDEADD;
  --ink: #201F18;
  --muted: #6E6A58;
  --line: #E2DFCF;
  --accent: #F2C230;
  --accent-soft: #F9E9B8;
  --accent-ink: #8A6D00;
  --code-bg: #201F18;
  --code-ink: #EDEADD;
  --code-label: #A29D87;
  --warn-bg: #FBF3DC;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16150F;
    --surface: #1F1E15;
    --surface2: #262418;
    --ink: #ECE9DB;
    --muted: #A29D87;
    --line: #33301F;
    --accent: #F5C842;
    --accent-soft: #3A331A;
    --accent-ink: #E8C24A;
    --code-bg: #100F0A;
    --code-ink: #E4E1D2;
    --code-label: #7E795F;
    --warn-bg: #2A2617;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Apple SD Gothic Neo", Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  line-height: 1.72;
  font-size: 16px;
}
code, pre { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }

/* ---- 레이아웃 ---- */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 264px;
  flex: none;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  border-right: 1px solid var(--line);
  background: var(--surface);
  padding: 1.5rem 1rem 3rem;
}
.main { flex: 1; min-width: 0; }
.content {
  max-width: 46em;
  margin: 0 auto;
  padding: 0 2rem 4rem;
}
.mobnav { display: none; }
@media (max-width: 880px) {
  .sidebar { display: none; }
  .mobnav {
    display: block;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .mobnav summary {
    padding: 0.8rem 1.2rem;
    cursor: pointer;
    font-weight: 700;
    list-style: none;
  }
  .mobnav summary::before { content: "☰ "; color: var(--accent-ink); }
  .mobnav .navwrap { max-height: 70vh; overflow-y: auto; padding: 0 1rem 1rem; }
  .content { padding: 0 1.1rem 3rem; }
}

/* ---- 사이드바 내비 ---- */
.brand {
  display: block;
  font-weight: 800;
  font-size: 1.05rem;
  letter-spacing: -0.01em;
  margin-bottom: 0.2rem;
  color: var(--ink);
  text-decoration: none;
}
.brand .bolt { color: var(--accent-ink); }
.brand-sub {
  font-size: 0.72rem;
  color: var(--muted);
  margin-bottom: 1.4rem;
}
.navgroup { margin-bottom: 1.1rem; }
.navlabel {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-ink);
  margin-bottom: 0.3rem;
  padding-left: 0.55rem;
}
.navgroup a {
  display: block;
  font-size: 0.82rem;
  color: var(--ink);
  text-decoration: none;
  padding: 0.22rem 0.55rem;
  border-left: 2px solid transparent;
  border-radius: 0 4px 4px 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.navgroup a:hover { background: var(--surface2); }
.navgroup a.active {
  border-left-color: var(--accent);
  background: var(--surface2);
  font-weight: 700;
}
a:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }

/* ---- 히어로 (index) ---- */
.hero {
  padding: 4rem 0 2.5rem;
  border-bottom: 1px solid var(--line);
  margin-bottom: 2rem;
}
.hero .eyebrow {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin: 0 0 0.8rem;
}
.hero h1 {
  font-size: clamp(2rem, 5vw, 2.9rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 0 0 1rem;
  text-wrap: balance;
}
.hero h1 .hl { background: linear-gradient(transparent 62%, var(--accent) 62%); }
.hero p.lede {
  font-size: 1.02rem;
  color: var(--muted);
  max-width: 38em;
  margin: 0 0 1.6rem;
}
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip {
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.3rem 0.7rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.chip b { color: var(--accent-ink); }
a.cta {
  display: inline-block;
  font-weight: 700;
  color: var(--ink);
  background: var(--accent);
  padding: 0.6rem 1.2rem;
  border-radius: 8px;
  text-decoration: none;
}
a.cta:hover { filter: brightness(1.05); }

/* ---- 목차 카드 (index) ---- */
.tocgroup h2 {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent-ink);
  margin: 2.2rem 0 0.8rem;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0.7rem;
}
.card {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  padding: 0.9rem 1rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  text-decoration: none;
  color: var(--ink);
}
.card:hover { border-color: var(--accent); background: var(--surface2); }
.card-num {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--accent-ink);
}
.card-title { font-weight: 750; font-size: 0.95rem; }
.card-sub { font-size: 0.78rem; color: var(--muted); }

/* ---- 챕터 본문 ---- */
.chapter { padding-top: 2.2rem; }
.chapter h1 {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.3;
  margin: 1rem 0 1.2rem;
  padding-left: 0.9rem;
  border-left: 5px solid var(--accent);
  text-wrap: balance;
}
.chapter h2 {
  scroll-margin-top: 1.5rem;
  font-size: 1.22rem;
  font-weight: 750;
  letter-spacing: -0.01em;
  margin: 2.6rem 0 0.8rem;
  text-wrap: balance;
}
.chapter h3 {
  scroll-margin-top: 1.5rem;
  font-size: 1.02rem;
  font-weight: 700;
  margin: 2rem 0 0.6rem;
}
.chapter p { margin: 0.8rem 0; }
.chapter a { color: var(--accent-ink); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.chapter ul, .chapter ol { margin: 0.7rem 0; padding-left: 1.5rem; }
.chapter li { margin: 0.32rem 0; }
.chapter hr { border: 0; border-top: 1px solid var(--line); margin: 2.5rem 0; }
.chapter strong { font-weight: 750; }

.chapter blockquote {
  margin: 1.2rem 0;
  padding: 0.75rem 1.1rem;
  background: var(--warn-bg);
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
}
.chapter blockquote p { margin: 0.3rem 0; font-size: 0.94rem; }

.chapter code {
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.08em 0.35em;
  font-size: 0.86em;
}
pre.code {
  position: relative;
  background: var(--code-bg);
  color: var(--code-ink);
  border-radius: 10px;
  padding: 1rem 1.1rem;
  overflow-x: auto;
  font-size: 0.82rem;
  line-height: 1.6;
  margin: 1rem 0;
}
pre.code code { background: none; border: 0; padding: 0; font-size: inherit; color: inherit; }
pre.code::before {
  content: attr(data-lang);
  position: absolute;
  top: 0.45rem;
  right: 0.8rem;
  font-size: 0.66rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--code-label);
}

.tablewrap { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--line); border-radius: 10px; }
.chapter table {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.88rem;
  font-variant-numeric: tabular-nums;
}
.chapter th {
  text-align: left;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  color: var(--accent-ink);
  background: var(--surface);
  padding: 0.55rem 0.8rem;
  border-bottom: 2px solid var(--accent);
  white-space: nowrap;
}
.chapter td {
  padding: 0.5rem 0.8rem;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.chapter tbody tr:last-child td { border-bottom: 0; }
.chapter tbody tr:hover td { background: var(--surface); }

.chapter details {
  margin: 1rem 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.6rem 1rem;
  background: var(--surface);
}
.chapter summary { cursor: pointer; font-weight: 700; }

/* ---- 다이어그램 ---- */
figure.diagram {
  margin: 1.6rem 0;
  padding: 1.2rem 1rem 0.9rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  overflow-x: auto;
}
figure.diagram svg {
  display: block;
  max-width: 100%;
  height: auto;
  min-width: 560px;
  margin: 0 auto;
}
figure.diagram figcaption {
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
  margin-top: 0.7rem;
  min-width: 560px;
}

/* ---- 이전/다음 ---- */
.pagenav {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 3rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--line);
}
.pn {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
  max-width: 48%;
  padding: 0.7rem 1rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  text-decoration: none;
  color: var(--ink);
}
.pn:hover { border-color: var(--accent); }
.pn.next { text-align: right; margin-left: auto; }
.pn-label { font-size: 0.72rem; color: var(--accent-ink); font-weight: 700; }
.pn-title { font-size: 0.9rem; font-weight: 700; }
</style>
</head>
<body>

<details class="mobnav">
  <summary>목차</summary>
  <div class="navwrap">
    <a class="brand" href="index.html" style="margin:0.8rem 0 0.6rem"><span class="bolt">⚡</span> ClickHouse Bible</a>
<!--NAV2-->
  </div>
</details>

<div class="layout">
  <nav class="sidebar" aria-label="목차">
    <a class="brand" href="index.html"><span class="bolt">⚡</span> ClickHouse Bible</a>
    <div class="brand-sub">Certified Developer 합격 로드맵</div>
<!--NAV-->
  </nav>

  <div class="main">
    <div class="content">
<!--CONTENT-->
      <footer class="footer" style="margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:0.78rem;color:var(--muted)">
        <p>모든 SQL 예제는 ClickHouse 26.8.1 <code>clickhouse local</code>에서 실행 검증 ·
        시험 정보: clickhouse.com/learn/certification (2026-08-16 확인) ·
        원본 마크다운은 저장소 <code>bible/</code></p>
      </footer>
    </div>
  </div>
</div>
</body>
</html>
